<!--
  yt-notes DIAGRAM LIBRARY
  Copy a <figure> block into the notes HTML, then edit the text, and add, remove or move shapes.
  All diagrams are inline SVG (no internet, no JS) and use the template's colours:
    --accent #1f4e8c  --soft #e8eef7  --ink #1b2430  --muted #5b6675  --warn #a15c00  --good #1e7a4f
  Rules: every shape labelled; max ~7 boxes per diagram; text >= 11px in the SVG (viewBox width 640);
  keep labels to 1-3 words, with detail in the caption. Draw YOUR OWN diagram of the idea.
  Never trace the video's slides, logos or characters.

  PATTERN              USE WHEN THE VIDEO...
  1 flow               explains steps in order (process, pipeline, request path)
  2 cycle              describes a loop that repeats (feedback loop, lifecycle)
  3 compare            contrasts two things (A vs B, before/after, old/new)
  4 layers             describes a stack or levels (architecture layers, hierarchy of needs)
  5 hub                has one central idea with parts (concept map, "N pillars")
  6 timeline           covers history, a roadmap, or dated milestones
  7 bars               gives numbers to compare (stats, costs, percentages)
  8 matrix             sorts things on two axes (effort/impact, risk/likelihood)
  9 architecture       shows components talking to each other (client, server, APIs, data)
-->
